<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Your Appointment | Nagomi Wellness Spa</title>
  <link rel="stylesheet" href="css/booking.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <section class="booking-section">
    <div class="booking-container">
      <h2>Book Your Appointment</h2>
      <p class="subtitle">Complete the form below to schedule your perfect spa treatment</p>

      <form class="booking-form">
        <!-- Select Service -->
        <label>Select Service <span>*</span></label>
        <div class="option-grid">
          <button type="button" class="option-btn">Nagomi Massage</button>
          <button type="button" class="option-btn">Ventosa or Cupping Therapy</button>
          <button type="button" class="option-btn">Shiatsu Massage</button>
          <button type="button" class="option-btn">Aromatherapy Massage</button>
          <button type="button" class="option-btn">Combination Massage</button>
          <button type="button" class="option-btn">Ayurvedic Massage</button>
          <button type="button" class="option-btn">Deep Tissue Massage</button>
          <button type="button" class="option-btn">Mandara Massage</button>
          <button type="button" class="option-btn">Pre Natal Massage</button>
          <button type="button" class="option-btn">Jade and Lavastone</button>
          <button type="button" class="option-btn">Swedish Massage</button>
          <button type="button" class="option-btn">Thai Massage</button>
        </div>

        <!-- Minutes -->
        <label>Minutes <span>*</span></label>
        <div class="option-grid small">
          <button type="button" class="option-btn">60 minutes</button>
          <button type="button" class="option-btn">90 minutes</button>
          <button type="button" class="option-btn">120 minutes</button>
        </div>

        <!-- Preferred Therapist -->
        <label>Preferred Therapist <small>(Optional)</small></label>
        <select>
          <option>Any available therapist</option>
          <option>Sarah Johnson</option>
          <option>Lisa Thompson</option>
          <option>Michelle Rodriguez</option>
        </select>

        <!-- Date and Time -->
        <div class="booking-row">
          <div class="input-group">
            <label>Preferred Date <span>*</span></label>
            <input type="date" required />
          </div>
          <div class="input-group">
            <label>Preferred Time <span>*</span></label>
            <select required>
              <option>Select time...</option>
              <option>9:00 AM</option>
              <option>10:00 AM</option>
              <option>11:00 AM</option>
              <option>1:00 PM</option>
              <option>2:00 PM</option>
              <option>3:00 PM</option>
              <option>4:00 PM</option>
              <option>5:00 PM</option>
            </select>
          </div>
        </div>

        <!-- Notes -->
        <label>Special Requests or Notes <small>(Optional)</small></label>
        <textarea placeholder="Any special requests, instructions, allergies, or preferences" maxlength="500"></textarea>
        <p class="char-count">0/500 characters</p>

        <!-- Name & Phone -->
        <div class="booking-row">
          <div class="input-group">
            <label>Full Name <span>*</span></label>
            <input type="text" placeholder="Enter your full name" required />
          </div>
          <div class="input-group">
            <label>Phone Number <span>*</span></label>
            <input type="text" placeholder="(555) 123-4567" required />
          </div>
        </div>

        <!-- Total -->
        <div class="total-box">
          <strong>Total Amount:</strong> <span>₱1199</span>
        </div>
        <p class="down-note">A 25% down payment (₱300) is required to confirm your booking.</p>

        <!-- Submit -->
        <button type="submit" class="confirm-btn">
          ✅ Confirm Booking
        </button>
      </form>
    </div>
  </section>
  <script src="js/booking.js"></script>

</body>
</html>
