<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login | Nagomi Wellness Spa</title>
  <link rel="stylesheet" href="css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-box">

      <span class="login-brand">Nagomi Wellness Spa</span>

      <div class="login-icon">🔒</div>
      <h2>Staff Login</h2>
      <p class="login-subtitle">Admin &amp; Therapist Access Only</p>

      <form id="loginForm">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required autocomplete="email" />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
        </div>

        <p id="loginMessage" class="login-message"></p>

        <button type="submit" class="login-btn">
          <span>Sign In</span>
          <span class="arrow">→</span>
        </button>
      </form>

      <div class="login-footer"></div>
    </div>

    <p class="login-watermark">zentraX Booking System</p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
