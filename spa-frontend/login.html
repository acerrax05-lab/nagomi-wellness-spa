<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Nagomi Wellness Spa</title>
  <link rel="stylesheet" href="css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-box">
      <div class="login-icon">👤</div>
      <h2>Welcome Back</h2>
      <p class="login-subtitle">Sign in to access your Nagomi Spa account</p>

      <form id="loginForm">
  <div class="input-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="Enter your email" required />
  </div>

  <div class="input-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password" required />
  </div>

  <!-- Add this line -->
  <p id="loginMessage" class="login-message"></p>

  <button type="submit" class="login-btn">
    <span>Sign In</span>
    <span class="arrow">➜</span>
  </button>
</form>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
